<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2c5f8a">

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LeadGen EU">
  <link rel="apple-touch-icon" href="/web/icon-192.png">
  <link rel="manifest" href="/manifest.json">

  <title>LeadGen EU</title>
  <link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header" id="appHeader">
    <div class="header-left">
      <button class="btn-icon" id="backBtn" onclick="history.back()" style="display:none">
        &#8592;
      </button>
    </div>
    <h1 class="header-title" id="headerTitle">LeadGen EU</h1>
    <div class="header-right">
      <span class="status-dot" id="statusDot" title="API status"></span>
    </div>
  </header>

  <!-- Main content -->
  <main id="app" class="app-main">
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Nalaganje...</p>
    </div>
  </main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <a class="nav-item" href="#dashboard" data-label="Nadzorna plošča">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item" href="#leads" data-label="Leadi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Leadi</span>
    </a>
    <a class="nav-item" href="#campaign" data-label="Kampanja">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span>Kampanja</span>
    </a>
    <a class="nav-item" href="#reports" data-label="Poročila">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Poročila</span>
    </a>
    <a class="nav-item" href="#settings" data-label="Nastavitve">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Nastavitve</span>
    </a>
  </nav>

  <!-- Toast notifications -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Scripts v=4 (cache bust) -->
  <script src="/web/js/api.js?v=4"></script>
  <script src="/web/js/dashboard.js?v=4"></script>
  <script src="/web/js/leads.js?v=4"></script>
  <script src="/web/js/lead-detail.js?v=4"></script>
  <script src="/web/js/campaign.js?v=4"></script>
  <script src="/web/js/reports.js?v=4"></script>
  <script src="/web/js/settings.js?v=4"></script>
  <script src="/web/js/app.js?v=4"></script>

  <!-- Chart.js CDN (za poročila) -->
  <script>
    // Lazy load Chart.js only when needed
    window._loadChartJs = () => new Promise((res) => {
      if (window.Chart) return res();
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js';
      s.onload = res;
      document.head.appendChild(s);
    });
  </script>

  <!-- Service Worker registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
